name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed solution
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Latency / presentation
        - Video quality
        - Input (gamepad / KBM)
        - Network (ICS / NAT / NIC)
        - UI / metrics
        - Docs
        - Other
