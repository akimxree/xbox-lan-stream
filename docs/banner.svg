<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Xbox LAN Stream">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08090a"/>
      <stop offset="0.55" stop-color="#0d1110"/>
      <stop offset="1" stop-color="#101a12"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.18" r="0.6">
      <stop offset="0" stop-color="#b6f36a" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#b6f36a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b6f36a" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#b6f36a" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#b6f36a" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#grid)"/>
  <rect width="1200" height="360" fill="url(#glow)"/>

  <g fill="none" stroke="#b6f36a" stroke-opacity="0.45" stroke-width="1.5">
    <path d="M120 250 H320 L360 210 H520"/>
    <path d="M1080 110 H900 L860 150 H700"/>
  </g>
  <g fill="#b6f36a">
    <circle cx="120" cy="250" r="4"/>
    <circle cx="520" cy="210" r="4"/>
    <circle cx="1080" cy="110" r="4"/>
    <circle cx="700" cy="150" r="4"/>
  </g>

  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <g transform="translate(80 96)">
      <rect x="0" y="-34" width="34" height="34" rx="9" fill="#b6f36a"/>
      <circle cx="17" cy="-17" r="6" fill="#0b0e07"/>
      <text x="52" y="-8" font-size="13" letter-spacing="5" fill="#9aa39c" font-weight="600">XBOX</text>
      <text x="118" y="-8" font-size="13" letter-spacing="5" fill="#5d665f" font-weight="600">LAN STREAM</text>
    </g>

    <text x="80" y="150" font-size="62" font-weight="700" fill="#f2f4f3" letter-spacing="-2">Локальный стрим</text>
    <text x="80" y="214" font-size="62" font-weight="700" fill="#b6f36a" letter-spacing="-2">без облачного видео</text>

    <text x="80" y="264" font-size="19" fill="#909795">Xbox Series X → Windows · WebRTC по Ethernet · latency 7–10 мс</text>

    <g transform="translate(80 300)" font-size="13" fill="#7f8781" font-family="Cascadia Mono, Consolas, monospace">
      <text>LAN 192.168.x.x</text>
      <text x="150">· 1080p60</text>
      <text x="250">· H.264</text>
      <text x="330">· freeze 0</text>
      <text x="430">· drop 0</text>
    </g>
  </g>

  <g transform="translate(900 236)">
    <rect x="0" y="0" width="220" height="76" rx="14" fill="#0c0f0d" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="18" y="26" font-size="10" letter-spacing="2" fill="#7f8781" font-family="Cascadia Mono, Consolas, monospace">MEDIA RTT</text>
    <text x="18" y="58" font-size="28" fill="#b6f36a" font-family="Cascadia Mono, Consolas, monospace">&lt; 0.2 ms</text>
    <circle cx="200" cy="18" r="4" fill="#b6f36a"/>
  </g>

  <rect x="0" y="356" width="1200" height="4" fill="url(#line)"/>
</svg>
